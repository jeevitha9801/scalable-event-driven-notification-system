  services:

    postgres:
      image: postgres:16
      container_name: postgres
      environment:
        POSTGRES_DB: notificationdb
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: admin
      ports:
        - "5433:5432"

    rabbitmq:
      image: rabbitmq:management
      container_name: rabbitmq
      ports:
        - "5672:5672"
        - "15672:15672"